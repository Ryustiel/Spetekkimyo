<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Glyph Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <header class="mb-8 flex flex-col gap-4 border-b border-slate-800 pb-6 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-xs uppercase tracking-[0.32em] text-sky-300/80">Glyph browser</p>
        <h1 class="mt-2 text-3xl font-semibold tracking-tight sm:text-4xl">Glyph gallery</h1>
        <p class="mt-3 max-w-2xl text-sm leading-6 text-slate-300">
          Loads the glyph list from the local glyph folder, shows a preview for each file, and lets you edit and save
          the EPS directly.
        </p>
        <p id="count" class="mt-2 text-sm text-slate-400">Loading...</p>
      </div>

      <div class="flex items-center gap-3">
        <button
          id="refreshBtn"
          type="button"
          class="inline-flex items-center justify-center rounded-xl border border-slate-700 bg-slate-900 px-4 py-2 text-sm font-medium text-slate-100 transition hover:border-sky-400/50 hover:bg-slate-800"
        >
          Refresh
        </button>
        <span id="status" class="rounded-full border border-slate-800 bg-slate-900/70 px-3 py-1 text-xs text-slate-300">Idle</span>
      </div>
    </header>

    <main id="grid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5"></main>
  </div>

  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm"></div>
    <div class="relative flex h-full w-full items-center justify-center p-3 sm:p-6">
      <div class="flex max-h-[94vh] w-full max-w-[96vw] flex-col overflow-hidden rounded-3xl border border-slate-800 bg-slate-900 shadow-2xl shadow-slate-950/60">
        <div class="flex items-start justify-between gap-4 border-b border-slate-800 px-4 py-4 sm:px-6">
          <div class="min-w-0">
            <p class="text-[10px] uppercase tracking-[0.32em] text-slate-500">Edit glyph</p>
            <h2 id="modalTitle" class="mt-1 break-all text-lg font-semibold text-slate-100 sm:text-xl">---</h2>
            <p id="modalStatus" class="mt-1 text-xs text-slate-400">---</p>
          </div>
          <div class="flex shrink-0 flex-wrap gap-2">
            <button
              data-close
              type="button"
              class="inline-flex items-center justify-center rounded-xl border border-slate-700 bg-slate-900 px-4 py-2 text-sm font-medium text-slate-100 transition hover:border-slate-500 hover:bg-slate-800"
            >
              Close
            </button>
            <button
              data-save
              type="button"
              class="inline-flex items-center justify-center rounded-xl border border-sky-400/30 bg-sky-400/10 px-4 py-2 text-sm font-medium text-sky-100 transition hover:border-sky-300/60 hover:bg-sky-400/15"
            >
              Save
            </button>
          </div>
        </div>

        <div class="flex min-h-0 flex-1 flex-col gap-4 overflow-hidden p-4 sm:p-6 lg:flex-row">
          <section class="flex min-h-0 flex-1 min-w-0 flex-col overflow-hidden rounded-2xl border border-slate-800 bg-slate-950/70 lg:basis-[58%]">
            <div class="flex items-center justify-between border-b border-slate-800 px-4 py-3">
              <span class="text-xs uppercase tracking-[0.3em] text-slate-500">Preview</span>
              <span id="previewStatus" class="text-xs text-slate-400">Waiting</span>
            </div>
            <div id="preview" class="flex min-h-0 flex-1 items-center justify-center overflow-hidden p-3 text-slate-100 sm:p-4 lg:p-5"></div>
          </section>

          <section class="flex min-h-0 flex-1 min-w-0 flex-col overflow-hidden rounded-2xl border border-slate-800 bg-slate-950/70 lg:basis-[42%]">
            <div class="flex items-center justify-between border-b border-slate-800 px-4 py-3">
              <span class="text-xs uppercase tracking-[0.3em] text-slate-500">File content</span>
              <span class="text-xs text-slate-400">Edit and save EPS</span>
            </div>
            <textarea
              id="editor"
              spellcheck="false"
              class="min-h-0 flex-1 w-full resize-none bg-transparent px-4 py-4 font-mono text-sm leading-6 text-slate-100 outline-none"
            ></textarea>
          </section>
        </div>

        <div class="flex items-center justify-between gap-3 border-t border-slate-800 px-4 py-4 sm:px-6">
          <button
            data-close
            type="button"
            class="inline-flex items-center justify-center rounded-xl border border-slate-700 bg-slate-900 px-4 py-2 text-sm font-medium text-slate-100 transition hover:border-slate-500 hover:bg-slate-800"
          >
            Close
          </button>
          <button
            data-save
            type="button"
            class="inline-flex items-center justify-center rounded-xl border border-sky-400/30 bg-sky-400/10 px-4 py-2 text-sm font-medium text-sky-100 transition hover:border-sky-300/60 hover:bg-sky-400/15"
          >
            Save
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const count = document.getElementById('count');
    const status = document.getElementById('status');
    const refreshBtn = document.getElementById('refreshBtn');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalStatus = document.getElementById('modalStatus');
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const previewStatus = document.getElementById('previewStatus');

    const state = {
      glyphs: [],
      activeName: '',
      originalContent: '',
      dirty: false,
      loadToken: 0,
      modalToken: 0,
      previewTimer: null,
      open: false,
    };

    function setBadge(el, text, kind) {
      const classes = {
        idle: 'rounded-full border border-slate-800 bg-slate-900/70 px-3 py-1 text-xs text-slate-300',
        busy: 'rounded-full border border-amber-400/30 bg-amber-400/10 px-3 py-1 text-xs text-amber-200',
        success: 'rounded-full border border-emerald-400/30 bg-emerald-400/10 px-3 py-1 text-xs text-emerald-200',
        error: 'rounded-full border border-rose-400/30 bg-rose-400/10 px-3 py-1 text-xs text-rose-200',
      };

      el.textContent = text;
      el.className = classes[kind] || classes.idle;
    }

    function setStatus(text, kind) {
      setBadge(status, text, kind);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseBoundingBox(text) {
      const match = text.match(/%%BoundingBox:\s*([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)\s+([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)\s+([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)\s+([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)/);
      if (!match) {
        return { minX: 0, minY: 0, maxX: 100, maxY: 100 };
      }

      return {
        minX: Number(match[1]),
        minY: Number(match[2]),
        maxX: Number(match[3]),
        maxY: Number(match[4]),
      };
    }

    function epsToSvg(text) {
      const { minX, minY, maxX, maxY } = parseBoundingBox(text);
      const width = Math.max(maxX - minX, 1);
      const height = Math.max(maxY - minY, 1);
      const numberRe = /^[-+]?(?:\d*\.?\d+|\d+)(?:[eE][-+]?\d+)?$/;
      const body = text
        .replace(/%%BoundingBox:[^\n]*\n?/i, '')
        .replace(/%.*$/gm, ' ');
      const tokens = body.match(/[-+]?\d*\.?\d+(?:[eE][-+]?\d+)?|[A-Za-z]+/g) || [];
      const stack = [];
      const parts = [];

      const clear = () => {
        stack.length = 0;
      };

      const consume = (count, build) => {
        if (stack.length < count) {
          clear();
          return;
        }

        const values = stack.splice(stack.length - count, count);
        parts.push(build(values));
        clear();
      };

      for (const token of tokens) {
        if (numberRe.test(token)) {
          stack.push(Number(token));
          continue;
        }

        switch (token) {
          case 'moveto':
            consume(2, ([x, y]) => `M ${x - minX} ${maxY - y}`);
            break;
          case 'lineto':
            consume(2, ([x, y]) => `L ${x - minX} ${maxY - y}`);
            break;
          case 'curveto':
            consume(6, ([x1, y1, x2, y2, x3, y3]) => `C ${x1 - minX} ${maxY - y1} ${x2 - minX} ${maxY - y2} ${x3 - minX} ${maxY - y3}`);
            break;
          case 'closepath':
            parts.push('Z');
            clear();
            break;
          default:
            clear();
            break;
        }
      }

      const pathData = parts.join(' ').trim();
      if (!pathData) {
        return null;
      }

      return `
        <svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" class="block h-full w-full max-h-full max-w-full" aria-hidden="true">
          <path d="${pathData}" fill="currentColor"></path>
        </svg>
      `;
    }

    function renderPreview(target, text) {
      const svg = epsToSvg(text);
      if (!svg) {
        target.innerHTML = '<div class="max-w-sm px-4 text-center text-sm text-slate-400">No path data detected</div>';
        return false;
      }

      target.innerHTML = svg;
      return true;
    }

    function findCard(name) {
      return Array.from(grid.querySelectorAll('button[data-name]')).find((button) => button.dataset.name === name) || null;
    }

    function syncActiveCardHighlight() {
      const buttons = grid.querySelectorAll('button[data-name]');
      buttons.forEach((button) => {
        const active = button.dataset.name === state.activeName && state.open;
        button.classList.toggle('ring-2', active);
        button.classList.toggle('ring-sky-400/70', active);
        button.classList.toggle('border-sky-400/60', active);
      });
    }

    function buildCard(name, active) {
      const activeClass = active ? ' ring-2 ring-sky-400/70 border-sky-400/60' : '';
      return `
        <button
          type="button"
          data-name="${escapeHtml(name)}"
          class="group flex flex-col overflow-hidden rounded-3xl border border-slate-800 bg-slate-900/80 text-left shadow-lg shadow-slate-950/30 transition hover:-translate-y-0.5 hover:border-sky-400/50 hover:shadow-sky-950/20 focus:outline-none focus:ring-2 focus:ring-sky-400/70${activeClass}"
        >
          <div class="border-b border-slate-800 bg-slate-950/60 px-4 py-3">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <div class="text-[10px] uppercase tracking-[0.32em] text-slate-500">Glyph</div>
                <div class="mt-1 break-all font-mono text-xs text-slate-200">${escapeHtml(name)}</div>
              </div>
              <div class="shrink-0 rounded-full border border-slate-700 bg-slate-950 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-[0.28em] text-slate-400">
                EPS
              </div>
            </div>
          </div>
          <div data-preview class="flex h-44 items-center justify-center overflow-hidden bg-slate-950 p-3 text-slate-500">
            <div class="animate-pulse text-xs uppercase tracking-[0.35em]">Loading</div>
          </div>
        </button>
      `;
    }

    async function fetchGlyphList() {
      const response = await fetch('/api/glyphs', { cache: 'no-store' });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const payload = await response.json();
      if (!payload || !Array.isArray(payload.glyphs)) {
        throw new Error('Invalid glyph list');
      }

      return payload.glyphs;
    }

    async function loadGlyphList() {
      const token = ++state.loadToken;
      setStatus('Loading glyphs...', 'busy');
      count.textContent = 'Loading...';
      grid.innerHTML = `
        <div class="col-span-full rounded-2xl border border-slate-800 bg-slate-900/60 px-4 py-6 text-sm text-slate-400">
          Loading glyphs from the local server...
        </div>
      `;

      try {
        const names = await fetchGlyphList();
        if (token !== state.loadToken) {
          return;
        }

        state.glyphs = names;
        count.textContent = `${names.length} glyph${names.length === 1 ? '' : 's'}`;
        grid.innerHTML = names.map((name) => buildCard(name, name === state.activeName)).join('');
        syncActiveCardHighlight();

        const cards = Array.from(grid.querySelectorAll('button[data-name]'));
        const previewJobs = cards.map(async (card) => {
          const name = card.dataset.name;
          const previewBox = card.querySelector('[data-preview]');
          try {
            const response = await fetch(`/api/glyph?name=${encodeURIComponent(name)}`, { cache: 'no-store' });
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }

            const text = await response.text();
            if (token !== state.loadToken) {
              return;
            }

            renderPreview(previewBox, text);
          } catch (error) {
            if (token !== state.loadToken) {
              return;
            }

            previewBox.innerHTML = '<div class="px-3 text-center text-sm text-rose-300">Preview unavailable</div>';
            card.title = `${name} - ${error.message}`;
          }
        });

        await Promise.allSettled(previewJobs);
        if (token !== state.loadToken) {
          return;
        }

        setStatus('Ready', 'success');
      } catch (error) {
        if (token !== state.loadToken) {
          return;
        }

        count.textContent = '0 glyphs';
        grid.innerHTML = `
          <div class="col-span-full rounded-2xl border border-rose-400/30 bg-rose-400/10 px-4 py-6 text-sm text-rose-200">
            Failed to load glyphs: ${escapeHtml(error.message)}
          </div>
        `;
        setStatus('Load failed', 'error');
      }
    }

    function openModal() {
      modal.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
      state.open = true;
      syncActiveCardHighlight();
    }

    function closeModal() {
      if (state.dirty && !window.confirm(`Discard changes to ${state.activeName}?`)) {
        return;
      }

      state.modalToken += 1;
      clearTimeout(state.previewTimer);
      modal.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
      state.open = false;
      state.activeName = '';
      state.originalContent = '';
      state.dirty = false;
      setSaveButtonsDisabled(false);
      modalTitle.textContent = '---';
      modalStatus.textContent = '---';
      previewStatus.textContent = 'Waiting';
      editor.value = '';
      preview.innerHTML = '';
      syncActiveCardHighlight();
    }

    function updateDirtyState() {
      state.dirty = editor.value !== state.originalContent;
      modalStatus.textContent = state.dirty ? 'Unsaved changes' : 'Loaded';
    }

    function setSaveButtonsDisabled(disabled) {
      modal.querySelectorAll('[data-save]').forEach((button) => {
        button.disabled = disabled;
      });
    }

    function updateModalPreview() {
      const rendered = renderPreview(preview, editor.value);
      previewStatus.textContent = rendered ? (state.dirty ? 'Unsaved changes' : 'Synced') : 'No path data';
      return rendered;
    }

    function schedulePreviewUpdate() {
      clearTimeout(state.previewTimer);
      state.previewTimer = setTimeout(() => {
        if (!state.open) {
          return;
        }

        updateModalPreview();
      }, 250);
    }

    async function openGlyph(name) {
      const token = ++state.modalToken;
      state.activeName = name;
      state.dirty = false;
      state.originalContent = '';
      modalTitle.textContent = name;
      modalStatus.textContent = 'Loading file...';
      previewStatus.textContent = 'Loading...';
      editor.value = '';
      preview.innerHTML = '<div class="animate-pulse text-xs uppercase tracking-[0.35em] text-slate-500">Loading</div>';
      setSaveButtonsDisabled(true);

      openModal();

      try {
        const response = await fetch(`/api/glyph?name=${encodeURIComponent(name)}`, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const text = await response.text();
        if (token !== state.modalToken) {
          return;
        }

        state.originalContent = text;
        editor.value = text;
        updateDirtyState();
        const rendered = updateModalPreview();
        previewStatus.textContent = rendered ? 'Loaded' : 'No path data';
        editor.focus();
        setSaveButtonsDisabled(false);
      } catch (error) {
        if (token !== state.modalToken) {
          return;
        }

        modalStatus.textContent = `Failed to load: ${error.message}`;
        previewStatus.textContent = 'Error';
        preview.innerHTML = '<div class="max-w-sm px-4 text-center text-sm text-rose-300">Unable to load the glyph file.</div>';
        setSaveButtonsDisabled(false);
      }
    }

    async function saveGlyph() {
      if (!state.activeName) {
        return;
      }

      const name = state.activeName;
      setSaveButtonsDisabled(true);

      modalStatus.textContent = 'Saving...';
      setStatus(`Saving ${name}`, 'busy');

      try {
        const response = await fetch(`/api/glyph?name=${encodeURIComponent(name)}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'text/plain; charset=utf-8',
          },
          body: editor.value,
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        state.originalContent = editor.value;
        state.dirty = false;
        updateModalPreview();
        modalStatus.textContent = 'Saved';
        setStatus(`Saved ${name}`, 'success');

        const card = findCard(name);
        if (card) {
          const previewBox = card.querySelector('[data-preview]');
          renderPreview(previewBox, editor.value);
        }
      } catch (error) {
        modalStatus.textContent = `Save failed: ${error.message}`;
        setStatus('Save failed', 'error');
      } finally {
        setSaveButtonsDisabled(false);
      }
    }

    refreshBtn.addEventListener('click', () => {
      loadGlyphList();
    });

    grid.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-name]');
      if (!button) {
        return;
      }

      openGlyph(button.dataset.name);
    });

    modal.addEventListener('click', (event) => {
      if (event.target === modal) {
        closeModal();
      }
    });

    modal.querySelectorAll('[data-close]').forEach((button) => {
      button.addEventListener('click', closeModal);
    });

    modal.querySelectorAll('[data-save]').forEach((button) => {
      button.addEventListener('click', saveGlyph);
    });

    editor.addEventListener('input', () => {
      updateDirtyState();
      schedulePreviewUpdate();
    });

    document.addEventListener('keydown', (event) => {
      if (!state.open) {
        return;
      }

      if (event.key === 'Escape') {
        event.preventDefault();
        closeModal();
        return;
      }

      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
        event.preventDefault();
        saveGlyph();
      }
    });

    loadGlyphList();
  </script>
</body>
</html>
